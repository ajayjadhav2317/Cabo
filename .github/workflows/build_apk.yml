name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev \
            libssl-dev automake autopoint gettext ccache

      - name: Configure pip constraints and dependencies
        run: |
          echo "pip<25.0" > ${{ github.workspace }}/constraints.txt
          echo "setuptools<70.0" >> ${{ github.workspace }}/constraints.txt
          pip install "pip<25.0"
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Ensure develop branch for python-for-android
        run: |
          python3 -c '
          with open("buildozer.spec", "r") as f:
              s = f.read()
          if "p4a.branch" not in s:
              s = s.replace("requirements = python3,pygame-ce", "requirements = python3,pygame-ce\np4a.branch = develop")
              with open("buildozer.spec", "w") as f:
                  f.write(s)
          '

      - name: Build with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: '1'
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cabo-android-apk
          path: bin/*.apk
          retention-days: 14
